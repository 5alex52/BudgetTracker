# Static checks only: the app and its tests run through Docker.
#   docker compose exec backend python -m pytest tests -q
# (see the root README.md). This file used to run pytest with pytest-xdist and
# pytest-html, which are not in pyproject.toml, so the job failed; now it checks
# what is actually declared in the dependencies.

image: python:3.13-slim

variables:
  POETRY_VIRTUALENVS_CREATE: "false"

before_script:
  - pip install poetry
  - poetry install --with dev --no-interaction --no-root

lint:
  stage: test
  script:
    - poetry run black --check --diff src tests scripts
    - poetry run pylint --exit-zero src tests scripts

typecheck:
  stage: test
  script:
    - poetry run python -m compileall -q src tests scripts

stages:
  - test
