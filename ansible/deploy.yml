---
# Main deployment playbook for BudgetTracker

- name: Deploy BudgetTracker
  hosts: budgettracker
  become: true

  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml

  pre_tasks:
    - name: Verify connectivity
      ansible.builtin.ping:

    - name: Check Ansible version
      ansible.builtin.assert:
        that:
          - ansible_version.full is version_compare('2.14', '>=')
        msg: "Ansible 2.14 or higher is required"

  roles:
    - role: setup
      tags: [setup, always]

    - role: docker
      tags: [docker, setup]

    - role: app
      tags: [app, deploy]

    - role: nginx
      tags: [nginx, deploy]

    - role: ssl
      tags: [ssl, setup]
      when: ssl_enabled | bool

    - role: backup
      tags: [backup, setup]
      when: backup_enabled | bool

  post_tasks:
    - name: Verify deployment
      ansible.builtin.uri:
        url: "https://{{ app_domain }}/health"
        method: GET
        validate_certs: "{{ ssl_enabled | bool }}"
        status_code: 200
      register: health_check
      retries: 5
      delay: 10
      until: health_check.status == 200
      ignore_errors: true

    - name: Display deployment status
      ansible.builtin.debug:
        msg: "Deployment completed successfully! Health check: {{ health_check.status | default('failed') }}"
