# Основной стек для локальной разработки:
#   docker compose up --build
#
# Все параметры имеют значения по умолчанию, поэтому файл работает без .env.
# Переопределить их можно через .env (см. .env.example) или переменные окружения.

name: budgettracker

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-LOCAL}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECRET_KEY: ${SECRET_KEY:-local-insecure-secret-key}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  # postgres
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-budgettracker}
  POSTGRES_USER: ${POSTGRES_USER:-budget}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget}
  # отдельная БД для pytest (создаётся/удаляется тестами автоматически)
  TEST_POSTGRES_HOST: postgres
  TEST_POSTGRES_PORT: 5432
  TEST_POSTGRES_DB: ${POSTGRES_DB:-budgettracker}
  TEST_POSTGRES_USER: ${POSTGRES_USER:-budget}
  TEST_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget}
  # redis / rabbitmq
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBIT_HOST: rabbitmq
  RABBIT_PORT: 5672
  RABBIT_USER: ${RABBIT_USER:-guest}
  RABBIT_PASSWORD: ${RABBIT_PASSWORD:-guest}
  # cors: адрес vite dev-сервера (значение по умолчанию, переопределяется CORS_ORIGINS в .env)
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
  CORS_HEADERS: '["Content-Type","Set-Cookie","Access-Control-Allow-Headers","Access-Control-Allow-Origin","Authorization"]'
  CORS_METHODS: '["GET","POST","PUT","PATCH","DELETE","OPTIONS"]'
  # OAuth и адрес фронтенда для писем/редиректов (провайдеры пока заглушки)
  OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
  OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
  OAUTH_RETURN_URL: ${OAUTH_RETURN_URL:-http://localhost:5173/}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

services:
  postgres:
    image: postgres:16-alpine
    container_name: budgettracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budgettracker}
      POSTGRES_USER: ${POSTGRES_USER:-budget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budget} -d ${POSTGRES_DB:-budgettracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: budgettracker-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # в dev-стеке нужны pytest/black внутри контейнера
        INSTALL_DEV: "true"
    container_name: budgettracker-backend
    restart: unless-stopped
    # код монтируется томом, поэтому включаем autoreload
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: budgettracker-frontend
    restart: unless-stopped
    environment:
      # vite проксирует /api на backend внутри docker-сети
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8000}
      VITE_PORT: 5173
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # анонимный том, чтобы node_modules из образа не перекрывались хостовым
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  # Фоновые задачи: брокер и воркер собраны в одном файле, но вынесены в профиль,
  # чтобы обычный запуск их не поднимал:
  #   docker compose --profile workers up --build
  #   docker compose -f docker-compose.prod.yml --profile workers up --build -d
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: budgettracker-rabbitmq
    restart: unless-stopped
    profiles: ["workers"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: budgettracker-celery
    restart: unless-stopped
    profiles: ["workers"]
    command: ["celery", "-A", "src.celery:celery_app", "worker", "--loglevel=info"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
