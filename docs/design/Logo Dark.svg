<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="darkPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="darkBgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="darkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фон иконки -->
  <rect width="120" height="120" rx="28" fill="url(#darkBgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- График роста -->
  <path d="M 24 75 L 48 50 L 72 62 L 96 32" fill="none" stroke="url(#darkPrimaryGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#darkGlow)" />
  
  <!-- Точки данных -->
  <circle cx="24" cy="75" r="4" fill="#00f2fe" />
  <circle cx="48" cy="50" r="4" fill="#3b82f6" />
  <circle cx="72" cy="62" r="4" fill="#3b82f6" />
  <circle cx="96" cy="32" r="5" fill="#00f2fe" />
</svg>