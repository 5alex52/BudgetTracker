<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg-gradient)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#1e293b" opacity="0.9"/>
  <circle cx="40" cy="30" r="16" fill="url(#accent-gradient)"/>
  <text x="70" y="38" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#f1f5f9">BudgetTracker</text>

  <!-- Sidebar -->
  <rect x="0" y="60" width="200" height="640" fill="#1e293b" opacity="0.7"/>
  <g transform="translate(20, 90)">
    <rect x="0" y="0" width="160" height="32" rx="8" fill="url(#accent-gradient)" opacity="0.2"/>
    <text x="40" y="21" font-family="system-ui, sans-serif" font-size="14" fill="#818cf8">Dashboard</text>

    <text x="40" y="61" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Accounts</text>
    <text x="40" y="101" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Records</text>
    <text x="40" y="141" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Analytics</text>
    <text x="40" y="181" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Settings</text>
  </g>

  <!-- Main Content -->
  <g transform="translate(220, 80)">
    <!-- Stats Cards -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="230" height="100" rx="12" fill="#1e293b"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Total Balance</text>
      <text x="20" y="60" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f1f5f9">$12,458</text>
      <text x="20" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#10b981">+12.5%</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="250" y="0" width="230" height="100" rx="12" fill="#1e293b"/>
      <text x="270" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Income</text>
      <text x="270" y="60" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#10b981">$4,230</text>
      <text x="270" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#10b981">+8.2%</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="500" y="0" width="230" height="100" rx="12" fill="#1e293b"/>
      <text x="520" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Expenses</text>
      <text x="520" y="60" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#ef4444">$2,847</text>
      <text x="520" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#ef4444">-3.1%</text>
    </g>

    <!-- Balance Chart -->
    <g filter="url(#shadow)" transform="translate(0, 120)">
      <rect x="0" y="0" width="730" height="200" rx="12" fill="#1e293b"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Balance Overview</text>

      <!-- Chart line -->
      <path d="M 40 160 Q 100 140, 150 120 T 250 100 T 350 90 T 450 70 T 550 60 T 650 50"
            stroke="url(#accent-gradient)" stroke-width="3" fill="none"/>
      <path d="M 40 160 Q 100 140, 150 120 T 250 100 T 350 90 T 450 70 T 550 60 T 650 50 L 650 180 L 40 180 Z"
            fill="url(#accent-gradient)" opacity="0.15"/>

      <!-- Grid lines -->
      <line x1="40" y1="60" x2="680" y2="60" stroke="#334155" stroke-width="1"/>
      <line x1="40" y1="100" x2="680" y2="100" stroke="#334155" stroke-width="1"/>
      <line x1="40" y1="140" x2="680" y2="140" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Donut Chart -->
    <g filter="url(#shadow)" transform="translate(0, 340)">
      <rect x="0" y="0" width="350" height="220" rx="12" fill="#1e293b"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Expense Structure</text>

      <!-- Donut segments -->
      <circle cx="120" cy="130" r="50" fill="none" stroke="#818cf8" stroke-width="24" stroke-dasharray="78.5 235.6" transform="rotate(-90 120 130)"/>
      <circle cx="120" cy="130" r="50" fill="none" stroke="#c084fc" stroke-width="24" stroke-dasharray="62.8 251.3" stroke-dashoffset="-78.5" transform="rotate(-90 120 130)"/>
      <circle cx="120" cy="130" r="50" fill="none" stroke="#f472b6" stroke-width="24" stroke-dasharray="47.1 266.9" stroke-dashoffset="-141.3" transform="rotate(-90 120 130)"/>
      <circle cx="120" cy="130" r="50" fill="none" stroke="#fbbf24" stroke-width="24" stroke-dasharray="31.4 282.6" stroke-dashoffset="-188.4" transform="rotate(-90 120 130)"/>

      <!-- Legend -->
      <g transform="translate(200, 80)">
        <rect x="0" y="0" width="12" height="12" rx="2" fill="#818cf8"/>
        <text x="20" y="11" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Cafes (25%)</text>

        <rect x="0" y="30" width="12" height="12" rx="2" fill="#c084fc"/>
        <text x="20" y="41" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Groceries (20%)</text>

        <rect x="0" y="60" width="12" height="12" rx="2" fill="#f472b6"/>
        <text x="20" y="71" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Transport (15%)</text>

        <rect x="0" y="90" width="12" height="12" rx="2" fill="#fbbf24"/>
        <text x="20" y="101" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Other (10%)</text>
      </g>
    </g>

    <!-- Accounts Cards -->
    <g filter="url(#shadow)" transform="translate(370, 340)">
      <rect x="0" y="0" width="360" height="220" rx="12" fill="#1e293b"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Accounts</text>

      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="320" height="48" rx="8" fill="#0f172a"/>
        <circle cx="24" cy="24" r="12" fill="#818cf8"/>
        <text x="48" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">Checking Account</text>
        <text x="48" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">USD</text>
        <text x="280" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="end">$8,234</text>
      </g>

      <g transform="translate(20, 108)">
        <rect x="0" y="0" width="320" height="48" rx="8" fill="#0f172a"/>
        <circle cx="24" cy="24" r="12" fill="#c084fc"/>
        <text x="48" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">Savings</text>
        <text x="48" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">EUR</text>
        <text x="280" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="end">€3,450</text>
      </g>

      <g transform="translate(20, 166)">
        <rect x="0" y="0" width="320" height="48" rx="8" fill="#0f172a"/>
        <circle cx="24" cy="24" r="12" fill="#f472b6"/>
        <text x="48" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">Cash</text>
        <text x="48" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">BYN</text>
        <text x="280" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="end">774 BYN</text>
      </g>
    </g>
  </g>
</svg>
